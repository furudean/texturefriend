name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Read app metadata
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      stable: ${{ steps.info.outputs.stable }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      exec_directory: ${{ steps.info.outputs.exec_directory }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read name and version from pyproject.toml
        id: info
        env:
          # empty when the workflow is dispatched on a branch instead of a tag
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          info="$(python3 scripts/app-info)"
          eval "$info"

          echo "$NAME is version $VERSION"

          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

          # a tag with a suffix, v1.2.3-rc1, is a pre-release
          case "$TAG" in
            *-*) stable=false prerelease=true ;;
            *) stable=true prerelease=false ;;
          esac

          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "stable=$stable"
            echo "prerelease=$prerelease"
            echo "exec_directory=$EXEC_DIRECTORY"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15
            target: macos-x86_64
            python_architecture: x64
            rosetta: true
            # uv 0.12.24 and later install arm64 wheels into the universal2
            # python under rosetta
            # https://github.com/astral-sh/uv/issues/13378
            # https://github.com/astral-sh/uv/pull/21304
            uv_version: 0.12.13
          - os: windows-latest
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
    env:
      # build against the CPython from setup-python, not a uv managed one,
      # because Nuitka does not support python-build-standalone interpreters
      UV_PYTHON_PREFERENCE: only-system
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        shell: ${{ matrix.rosetta && 'arch -x86_64 /bin/bash --noprofile --norc -eo pipefail {0}' || 'bash' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          architecture: ${{ matrix.python_architecture }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ matrix.uv_version }}
          enable-cache: true

      # Nuitka needs patchelf to fix up the rpaths of the bundled Qt libraries.
      # libxcb-cursor0 has to be present at build time for Nuitka to bundle it.
      # desktop-file-utils is used by appimagetool to validate the desktop file.
      # ccache is used to speed up builds
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ccache patchelf libxcb-cursor0 desktop-file-utils

      # ccache is used to speed up builds
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ccache

      # without this Nuitka falls back to a downloaded zig, which is slower
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "vswhere=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%vswhere%" -latest -products * -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          )

          if not defined WindowsSDKVersion (
            echo ::error::the Windows SDK is missing from the MSVC environment
            exit /b 1
          )

          set | findstr /v /b "=" >> "%GITHUB_ENV%"

      - name: Restore Nuitka cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.nuitka-cache
          key: nuitka-${{ matrix.target }}-${{ hashFiles('uv.lock', 'pysidedeploy.spec', '.python-version') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ matrix.target }}-${{ hashFiles('uv.lock', 'pysidedeploy.spec', '.python-version') }}-
            nuitka-${{ matrix.target }}-

      - name: Build
        run: ./scripts/build.sh

      # the two mac bundles are merged into a universal one by the next job,
      # which is where they get signed, notarized and packaged. ditto keeps the
      # permissions and symlinks that upload-artifact would otherwise drop
      - name: Archive the bundle for merging
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "$EXEC_DIRECTORY/$NAME.app" app.zip
        env:
          NAME: ${{ needs.meta.outputs.name }}
          EXEC_DIRECTORY: ${{ needs.meta.outputs.exec_directory }}

      - name: Upload the bundle to the workflow
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.target }}
          path: app.zip
          if-no-files-found: error

      - name: Package
        if: runner.os != 'macOS'
        run: ./scripts/package.sh "${{ matrix.target }}"

      - name: Upload artifact to workflow
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: staging
          if-no-files-found: error

  universal:
    name: Create universal macOS app from build
    needs: [meta, build]
    # deliberately use macos-26 to give us newer icon composition
    runs-on: macos-26
    env:
      NAME: ${{ needs.meta.outputs.name }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Download the macOS bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-macos-*
          path: bundles

      - name: Unpack the bundles
        run: |
          for arch in arm64 x86_64; do
            ditto -x -k "bundles/app-macos-$arch/app.zip" "bundles/$arch"
          done

      - name: Import signing certificate
        if: env.MACOS_SIGN_IDENTITY != ''
        run: ./scripts/macos-keychain.sh

      - name: Merge the two architectures
        run: |
          ./scripts/macos-lipo.sh \
            "bundles/arm64/$NAME.app" "bundles/x86_64/$NAME.app"

      - name: Compile the icon catalogue
        run: ./scripts/macos-icon.sh

      - name: Sign and notarize
        run: ./scripts/macos-sign.sh

      - name: Package
        run: ./scripts/package.sh macos-universal

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos-universal
          path: staging
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [meta, build, universal]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
      STABLE: ${{ needs.meta.outputs.stable }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true

      - name: Create the release
        run: |
          ls -l artifacts
          ./scripts/changelog-notes.sh "$TAG" > notes.md

          assets=()
          for path in artifacts/*; do
            case "${path##*/}" in
              *macos-universal.dmg) label="macOS Application (universal, disk image)" ;;
              *macos-universal.zip) label="macOS Application (universal, archive)" ;;
              *windows-x86_64.zip) label="Windows Application (x86-64, archive)" ;;
              *linux-x86_64.AppImage) label="Linux AppImage (x86-64)" ;;
              *linux-x86_64) label="Linux Executable (x86-64)" ;;
              *)
                echo "::warning::no label for $path"
                assets+=("$path")
                continue
                ;;
            esac
            assets+=("$path#$label")
          done

          gh release create "$TAG" "${assets[@]}" \
            --notes-file notes.md --prerelease="$PRERELEASE" --latest="$STABLE"

  homebrew:
    name: Update homebrew tap
    needs: [meta, release]
    if: needs.meta.outputs.stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download the macOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-macos-universal
          path: artifacts

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: furudean/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump cask version
        env:
          NAME: ${{ needs.meta.outputs.name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          asset="artifacts/$NAME-$VERSION-macos-universal.zip"
          sha256="$(sha256sum "$asset" | cut -d' ' -f1)"
          cask="tap/Casks/$NAME.rb"

          echo "$asset is $sha256"

          sed -i -E "s|^  version \".*\"|  version \"$VERSION\"|" "$cask"
          sed -i -E "s|^(\s*sha256\s+)\".*\"|\1\"$sha256\"|" "$cask"

          if git -C tap diff --quiet; then
            echo "::notice::cask already up to date"
            exit 0
          fi

          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap commit --all --message "$NAME $VERSION"
          git -C tap push
