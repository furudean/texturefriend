name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: RunsOn setup
        uses: runs-on/action@454f69dd7216cb878a1a8b1728b4f9bfdfeaaec4 # v2.3.0

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # PySide6's offscreen platform plugin dynamically load EGL/GL and
      # a few other shared libraries even though it never opens a display, so
      # QApplication() fails to import without them present.
      - name: Install Qt runtime dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libegl1 libgl1 libxkbcommon0 libdbus-1-3
          version: 1.0

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Generate app metadata
        run: uv run python scripts/generate-metadata

      - name: Ruff lint
        run: uv run poe lint

      - name: Ruff format check
        run: uv run poe fmt-check

      - name: Mypy
        run: uv run poe types

      - name: Check licences
        run: uv run poe licences --check

      - name: Pytest
        run: uv run poe test
