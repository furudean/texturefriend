[project]
name = "texturefriend"
version = "1.1.0"
description = "a cross-platform tool to browse and export textures from the second life texture cache"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "imagecodecs>=2026.10.10",
    "pillow>=13.0.0",
    "pyside6>=6.12.0",
    "texture-courier>=0.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "nuitka>=4.3.3",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["setuptools", "wheel", "build"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["texturefriend*"]

[tool.setuptools.package-data]
texturefriend = ["assets/*.png", "assets/licences/*.txt", "assets/licences/*.toml"]

[project.scripts]
texturefriend = "texturefriend.main:main"

[tool.app]
display-name = "TextureFriend"
bundle-id = "com.furudean.texturefriend"
company-name = "paisley softworks"
copyright = "Copyright (c) 2026 meri p"
macos-category = "public.app-category.utilities"

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "lint with ruff"

[tool.poe.tasks.fmt]
cmd = "ruff format ."
help = "format with ruff"

[tool.poe.tasks.fmt-check]
cmd = "ruff format --check ."
help = "check formatting without writing"

[tool.poe.tasks.types]
cmd = "mypy ."
help = "type check with mypy"

[tool.poe.tasks.test]
cmd = "pytest"
help = "run the test suite"

[tool.poe.tasks.licences]
cmd = "python scripts/licences"
help = "rebuild the licence list from the installed packages"

[tool.poe.tasks.check]
sequence = ["lint", "fmt-check", "types", { ref = "licences --check" }, "test"]
help = "run all CI checks"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
exclude = ["build", "dist"]
strict = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.bandit]
# build output is a copy of the package, and dist is what was shipped from it,
# so scanning either only reports every finding a second time
exclude_dirs = ["build", "dist", ".venv", "tests"]
